<!DOCTYPE html>
<html>
<head>
<title>Login - Employee Manager</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/login.css">
</head>

<body class="dark">

<div class="login-card">

    <button type="button" class="theme-toggle" onclick="toggleTheme()">
        🌗 Theme
    </button>

    <div class="logo"><span>&lt;/&gt;</span> EmployeeManager</div>

    <h1>Sign in</h1>

    <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" autofocus maxlength="10">

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" maxlength="20">

        <button type="submit">Sign in</button>
    </form>

    <div id="errorBox" class="error-box"></div>

</div>

<script src="/static/js/theme.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/login.js"></script>

</body>
</html>
