name: CI

on:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy

      - name: mypy
        run: mypy . --ignore-missing-imports

  # tests/unit, tests/integration, tests/functional and tests/selenium each
  # get their own job below so a failure in one test type shows up on its
  # own line in the checks list instead of being buried in one combined
  # log, and so they run in parallel. Two directories under tests/ are
  # intentionally NOT wired in as CI stages:
  #   - tests/acceptance: Gherkin .feature files with no step definitions
  #     or runner (see tests/acceptance/README.md) — there's nothing here
  #     for pytest/behave to execute. It's UAT documentation, checked off
  #     manually via tests/acceptance/CHECKLIST.md.
  #   - tests/locust: a load test against a running instance of the app,
  #     with its own heavy dependency set kept out of requirements.txt on
  #     purpose (see tests/locust/requirements.txt). It's meant to be run
  #     deliberately, not on every CI trigger — add a job for it if you
  #     want a scheduled or on-demand performance stage.
  test-unit:
    name: Test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest tests/unit
        # Coverage data is written per-job (COVERAGE_FILE) and combined in
        # the coverage job below instead of being gated here — one suite's
        # slice of main.py isn't representative of overall coverage, so
        # --cov-report is left empty and no fail_under is enforced yet.
        env:
          COVERAGE_FILE: .coverage.unit
        run: pytest tests/unit --cov=main --cov-report=

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true

  test-integration:
    name: Test (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest tests/integration
        env:
          COVERAGE_FILE: .coverage.integration
        run: pytest tests/integration --cov=main --cov-report=

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true

  test-functional:
    name: Test (functional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest tests/functional
        env:
          COVERAGE_FILE: .coverage.functional
        run: pytest tests/functional --cov=main --cov-report=

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-functional
          path: .coverage.functional
          include-hidden-files: true

  test-selenium:
    name: Test (Selenium UI)
    runs-on: ubuntu-latest
    # Not folded into the coverage gate below: it drives a real headless
    # Chrome browser rather than exercising main.py's code paths directly,
    # so its contribution to line coverage isn't meaningful. ubuntu-latest
    # ships Chrome preinstalled, and Selenium 4's Selenium Manager downloads
    # a matching chromedriver automatically — see tests/selenium/conftest.py
    # and tests/selenium/TEST_PLAN.md.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest tests/selenium
        run: pytest tests/selenium

  selenium-gate:
    name: Selenium gate
    # A thin pass-through, purely so the Actions graph draws
    # tests/selenium as its own block (like test-unit/integration/
    # functional -> coverage) instead of lumping it in with
    # lint/typecheck/security just because they'd otherwise share the
    # same direct successors (build-macos/build-windows).
    needs: [test-selenium]
    runs-on: ubuntu-latest
    steps:
      - run: echo "tests/selenium passed"

  coverage:
    name: Coverage gate
    needs: [test-unit, test-integration, test-functional]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine per-suite coverage data
        # coverage combine auto-discovers files matching ".coverage.*" (the
        # coverage-unit/coverage-integration/coverage-functional artifacts
        # downloaded above) and merges them into a single .coverage file.
        run: coverage combine

      - name: Coverage report (90% floor from pyproject.toml)
        # Coverage is scoped to main.py (the app logic) via
        # [tool.coverage.run] source in pyproject.toml; run.py is the
        # PyInstaller/uvicorn entrypoint and is exercised by the
        # build-macos/build-windows smoke tests instead. The 90% floor
        # (see [tool.coverage.report] fail_under) sits a few points below
        # the ~98% currently achieved, leaving headroom before this needs
        # revisiting. tests/selenium isn't part of this combine, for the
        # same reason it was excluded from the coverage run before this
        # workflow was split into per-type jobs.
        run: coverage report --show-missing

  security:
    name: Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit pip-audit

      # - name: Bandit
      #   run: bandit -r . -x ./.venv,./tests

      # - name: pip-audit
      #   run: pip-audit -r requirements.txt

  complexity:
    name: Code complexity (McCabe)
    # Informational only — not part of `needs` for any build job below, so a
    # high-complexity function doesn't block a release. It's here so
    # complexity trends are visible on every run instead of only when
    # someone thinks to run radon locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Radon
        run: pip install radon

      - name: Cyclomatic complexity (McCabe) — radon cc
        # -s: show the raw McCabe score next to each A-F letter grade.
        # -a: print the average complexity per file.
        # --total-average: add one repo-wide average at the end.
        # .venv is excluded — it's vendored dependency code, not ours.
        run: radon cc . -s -a --total-average -e ".venv/*"

      - name: Add to job summary
        # Same command again, piped into the Actions run's summary page so
        # the report is one click away instead of buried in a step log.
        run: |
          {
            echo "### Cyclomatic complexity (McCabe) — radon cc"
            echo '```'
            radon cc . -s -a --total-average -e ".venv/*"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    name: Build macOS
    needs:
      [
        lint,
        typecheck,
        test-unit,
        test-integration,
        test-functional,
        selenium-gate,
        coverage,
        security,
      ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install fastapi uvicorn pyinstaller

      - name: Build APP
        run: |
          pyinstaller run.py \
            --name run \
            --windowed \
            --add-data "static:static" \
            --hidden-import=anyio._backends._asyncio \
            --hidden-import=anyio._backends._trio \
            --hidden-import=sqlite3 \
            --collect-all anyio \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all starlette
      - name: Test app start
        run: |
          chmod +x dist/run.app/Contents/MacOS/run
          dist/run.app/Contents/MacOS/run &
          sleep 6
          curl -f http://127.0.0.1:8000/health
          curl -f http://127.0.0.1:8000/
          curl -f http://127.0.0.1:8000/login
          curl -f http://127.0.0.1:8000/static/css/theme.css

          # Exercise the SQLite-backed employee storage end-to-end — a
          # packaged build is the one environment where a sqlite3
          # packaging issue (missing hidden import, wrong DB path
          # resolution under sys.frozen) would actually surface.
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8000/api/login \
            -H "Content-Type: application/json" \
            -d '{"username": "admin", "password": "admin"}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          curl -sf -X POST http://127.0.0.1:8000/api/employees \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"name": "Smoke Test", "salary": 5000, "age": 30, "position": "Mid QA", "on_leave": false}'
          curl -sf http://127.0.0.1:8000/api/employees -H "Authorization: Bearer $TOKEN" | grep -q "Smoke Test"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/run.app

  build-linux:
    name: Build Linux
    needs:
      [
        lint,
        typecheck,
        test-unit,
        test-integration,
        test-functional,
        selenium-gate,
        coverage,
        security,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install fastapi uvicorn pyinstaller

      - name: Install Xvfb
        # run.py's __main__ opens a real tkinter status window (see
        # show_window() in run.py) — it's not just a headless server, so the
        # packaged binary needs an X display to start at all, even for this
        # smoke test. ubuntu-latest doesn't have one by default; Xvfb
        # provides a virtual framebuffer display so tkinter has somewhere to
        # draw. macOS/Windows runners don't need this — they already have a
        # windowing session (Aqua / the interactive desktop).
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build binary
        # --onefile, like the Windows build — Linux has no app-bundle
        # convention the way macOS does. No --windowed here: that flag only
        # suppresses a console window on Windows/macOS, PyInstaller ignores
        # it on Linux.
        run: |
          pyinstaller run.py \
            --name run \
            --onefile \
            --add-data "static:static" \
            --hidden-import=anyio._backends._asyncio \
            --hidden-import=anyio._backends._trio \
            --hidden-import=sqlite3 \
            --collect-all anyio \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all starlette
      - name: Test app start
        run: |
          chmod +x dist/run
          xvfb-run -a dist/run &
          sleep 6
          curl -f http://127.0.0.1:8000/health
          curl -f http://127.0.0.1:8000/
          curl -f http://127.0.0.1:8000/login
          curl -f http://127.0.0.1:8000/static/css/theme.css

          # Exercise the SQLite-backed employee storage end-to-end — a
          # packaged build is the one environment where a sqlite3
          # packaging issue (missing hidden import, wrong DB path
          # resolution under sys.frozen) would actually surface.
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8000/api/login \
            -H "Content-Type: application/json" \
            -d '{"username": "admin", "password": "admin"}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          curl -sf -X POST http://127.0.0.1:8000/api/employees \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"name": "Smoke Test", "salary": 5000, "age": 30, "position": "Mid QA", "on_leave": false}'
          curl -sf http://127.0.0.1:8000/api/employees -H "Authorization: Bearer $TOKEN" | grep -q "Smoke Test"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: dist/run

  build-windows:
    name: Build Windows
    needs:
      [
        lint,
        typecheck,
        test-unit,
        test-integration,
        test-functional,
        selenium-gate,
        coverage,
        security,
      ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install fastapi uvicorn pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller run.py `
            --name run `
            --onefile `
            --windowed `
            --add-data "static;static" `
            --hidden-import=anyio._backends._asyncio `
            --hidden-import=anyio._backends._trio `
            --hidden-import=sqlite3 `
            --collect-all anyio `
            --collect-all fastapi `
            --collect-all uvicorn `
            --collect-all starlette
      - name: Test app start
        shell: powershell
        run: |
          Start-Process dist/run.exe
          Start-Sleep -Seconds 6
          Invoke-WebRequest http://127.0.0.1:8000/health -UseBasicParsing
          Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          Invoke-WebRequest http://127.0.0.1:8000/login -UseBasicParsing
          Invoke-WebRequest http://127.0.0.1:8000/static/css/theme.css -UseBasicParsing

          # Exercise the SQLite-backed employee storage end-to-end — a
          # packaged build is the one environment where a sqlite3
          # packaging issue (missing hidden import, wrong DB path
          # resolution under sys.frozen) would actually surface.
          $login = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8000/api/login `
              -ContentType "application/json" -Body '{"username": "admin", "password": "admin"}'
          $headers = @{ Authorization = "Bearer $($login.access_token)" }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8000/api/employees `
              -ContentType "application/json" -Headers $headers `
              -Body '{"name": "Smoke Test", "salary": 5000, "age": 30, "position": "Mid QA", "on_leave": false}'
          $employees = Invoke-RestMethod -Uri http://127.0.0.1:8000/api/employees -Headers $headers
          if (-not ($employees | Where-Object { $_.name -eq "Smoke Test" })) {
              throw "Smoke Test employee not found after creation"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/run.exe

  tag-release:
    name: Tag Release
    needs: [build-macos, build-linux, build-windows]
    # Only tag off main — a manual dispatch from a feature branch shouldn't
    # mint a release tag for a CHANGELOG.md entry that isn't on main yet.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + existing tags to check for duplicates

      - name: Read version from the top of CHANGELOG.md
        id: version
        run: |
          VERSION=$(grep -m1 -oP '(?<=^## \[)[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          if [ -z "$VERSION" ]; then
            echo "Could not find a '## [X.Y.Z]' heading at the top of CHANGELOG.md" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag and push, if this version isn't tagged yet
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to do (CHANGELOG.md's top entry wasn't bumped since the last run)."
            exit 0
          fi

          # Pull this version's release notes straight out of CHANGELOG.md:
          # everything from its "## [X.Y.Z]" heading up to (not including)
          # the next one, so the tag message always matches the changelog.
          NOTES=$(awk '/^## \[/{if (found) exit; found=1; next} found' CHANGELOG.md)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" -m "$NOTES"
          git push origin "$TAG"
